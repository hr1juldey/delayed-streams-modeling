[project]
name = "voice_server"
version = "0.1.0"
description = "FastAPI voice microservice server with STT and TTS WebSocket endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "msgpack>=1.0.0",
    "pocket-tts>=0.1.0",
    "faster-whisper>=1.0.0",
    "julius>=0.2.0",
    "prometheus-client>=0.21.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_server/src", "voice_server/config"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.watchfiles]
ignore_patterns = [
    "tests/",
    "examples/",
    "data/",
    "*.pyc",
    "__pycache__/",
    ".git/",
]
